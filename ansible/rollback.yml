---
# ==============================================================================
# Disaster Recovery & Automated Rollback Playbook
# Telecom Service Outage Dashboard
# Student: Manas Akhare | Roll No: 23102C0017
# Usage: ansible-playbook -i inventory.ini rollback.yml
# ==============================================================================

- name: Automated Rollback to Previous Stable Release Baseline
  hosts: telecom_prod_servers:telecom_staging_servers:telecom_local
  become: yes
  gather_facts: no

  vars:
    app_install_dir: "/opt/telecom-dashboard"
    app_jar_name: "telecom-service-outage-dashboard.jar"
    systemd_service_name: "telecom-dashboard"
    health_check_url: "http://127.0.0.1:8080/api/health"

  tasks:
    - name: 1. Verify existence of previous stable backup artifact
      stat:
        path: "{{ app_install_dir }}/backup/{{ app_jar_name }}.previous"
      register: backup_stat
      failed_when: not backup_stat.stat.exists

    - name: 2. Stop current faulty application instance
      systemd:
        name: "{{ systemd_service_name }}"
        state: stopped

    - name: 3. Restore previous stable binary from backup directory
      copy:
        src: "{{ app_install_dir }}/backup/{{ app_jar_name }}.previous"
        dest: "{{ app_install_dir }}/{{ app_jar_name }}"
        remote_src: yes
        owner: telecom
        group: telecom
        mode: '0644'

    - name: 4. Restart Telecom Dashboard service on restored version
      systemd:
        name: "{{ systemd_service_name }}"
        state: started

    - name: 5. Verify Post-Rollback Health Check Status (200 OK)
      uri:
        url: "{{ health_check_url }}"
        status_code: 200
        return_content: yes
      register: rollback_health
      until: rollback_health.status == 200
      retries: 6
      delay: 5

    - name: 6. Confirmation of successful recovery
      debug:
        msg: "ROLLBACK SUCCESSFUL: Node restored to stable release. Health Status={{ rollback_health.json.status }}"
