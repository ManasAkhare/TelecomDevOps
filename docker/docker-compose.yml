version: '3.8'

services:
  telecom-dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: telecom/outage-dashboard:1.0.0
    container_name: telecom-outage-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - telecom-net

  nginx-reverse-proxy:
    image: nginx:alpine
    container_name: telecom-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../ansible/roles/telecom_app/templates/nginx.conf.j2:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      telecom-dashboard:
        condition: service_healthy
    networks:
      - telecom-net

networks:
  telecom-net:
    driver: bridge
